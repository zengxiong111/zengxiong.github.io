# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Build and deploy Jekyll including the latest verified Foundation of Embodied AI RTC materials
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Synchronize current Foundation of Embodied AI downloads
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM="$RUNNER_TEMP/foundation-embodied-course"
          git clone --quiet --depth 1 https://github.com/zengxiong111/Foundation_of_Embodied_AI.git "$UPSTREAM"
          python3 - "$UPSTREAM" <<'PY'
          import json, sys
          from pathlib import Path
          upstream = Path(sys.argv[1]).resolve()
          website = Path.cwd().resolve()
          manifest = json.loads((upstream / "materials.json").read_text())
          assert len(manifest["topics"]) == 14
          copies = 0
          for topic in manifest["topics"]:
              for lang in ("zh", "en"):
                  item = topic["documents"][lang]
                  for ext in ("md", "pdf"):
                      source = upstream / item[ext]
                      destination = (website / item["site_" + ext]).resolve()
                      if not destination.is_relative_to(website / "files"):
                          raise RuntimeError("Unsafe website path: " + str(destination))
                      if not source.is_file():
                          raise FileNotFoundError(source)
                      payload = source.read_bytes()
                      if ext == "md" and payload.startswith(b"---\n"):
                          payload = b"\n" + payload
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(payload)
                      assert destination.read_bytes() == payload
                      copies += 1
          for lang in ("Chinese", "English"):
              name = f"Foundation_of_Embodied_AI_Complete_{lang}.pdf"
              src = upstream / "books" / name
              assert src.is_file()
              dst = website / "files" / name
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(src.read_bytes())
              copies += 1
          assert copies == (4 * len(manifest["topics"]) + 2), copies
          print("Synced and verified", copies, "course files into website/files/")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- files/
          if git diff --cached --quiet; then
            echo "Website already has all current course materials."
          else
            git commit -m "Publish 26 bilingual chapter PDFs and two complete course books"
            git push origin HEAD:master
          fi
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Verify all current deployable course files
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          upstream = Path(os.environ["RUNNER_TEMP"]) / "foundation-embodied-course"
          manifest = json.loads((upstream / "materials.json").read_text())
          items = []
          for topic in manifest["topics"]:
              for lang in ("zh", "en"):
                  docs = topic["documents"][lang]
                  items.extend([docs["site_md"], docs["site_pdf"]])
          for lang in ("Chinese", "English"):
              items.append(f"files/Foundation_of_Embodied_AI_Complete_{lang}.pdf")
          assert len(items) == (4 * len(manifest["topics"]) + 2)
          for item in items:
              source = Path(item)
              rendered = Path("_site") / item
              if not rendered.is_file():
                  raise RuntimeError("Published output missing: " + item)
              if source.read_bytes() != rendered.read_bytes():
                  raise RuntimeError("Rendered output differs: " + item)
          print("Validated", len(items), "byte-identical chapter/book downloads in _site")
          PY
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
