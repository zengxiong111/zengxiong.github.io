{% include base_path %}

<!-- start custom head snippets -->

<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
<link rel="shortcut icon" href="{{ base_path }}/images/favicon.ico?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon.png?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>


<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- end custom head snippets -->
